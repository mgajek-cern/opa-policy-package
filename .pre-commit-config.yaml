exclude: ^(services/authorization-service/|phases/phase6-opa/src/rucio_authz_client/)

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements       # catches leftover breakpoint() / pdb

  # Python — ruff (linter + formatter, replaces flake8/black/isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff                   # linter
        args: [--fix]
      - id: ruff-format            # formatter (replaces black)

  - repo: local
    hooks:
      - id: opa-fmt
        name: opa fmt
        entry: opa fmt --list --fail
        language: system
        files: \.rego$
      - id: opa-check
        name: opa check
        entry: opa check --strict
        language: system
        files: \.rego$
