exclude: ^services/authorization-service/(src/authz_service/api/generated|clients)/

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements       # catches leftover breakpoint() / pdb

  # Python — ruff (linter + formatter, replaces flake8/black/isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff                   # linter
        args: [--fix]
      - id: ruff-format            # formatter (replaces black)

  - repo: local
    hooks:
      - id: authz-service-lint
        name: authz-service lint (ruff + import contracts)
        entry: make -C services/authorization-service lint
        language: system
        pass_filenames: false
        files: ^services/authorization-service/(src|tests)/

      - id: authz-service-typecheck
        name: authz-service mypy
        entry: make -C services/authorization-service typecheck
        language: system
        pass_filenames: false
        files: ^services/authorization-service/(src|tests)/
