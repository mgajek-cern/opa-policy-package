services:
  xrd3:
    image: rucio/test-xrootd@sha256:27d212ec136d6d2ed7029fc445384053acb551805060cae554597a32e6361df4
    hostname: xrd3
    environment:
      - XRDPORT=1094
    ports:
      - "1094:1094"
    networks:
      - dep-dlm-testbed
    volumes:
      - ./certs/xrd3cert.pem:/tmp/xrdcert.pem:ro
      - ./certs/xrd3key.pem:/tmp/xrdkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/rucio_ca.pem:/etc/pki/ca-trust/source/anchors/rucio-ca.crt:ro
      - ./configs/xrootd/xrdrucio-scitokens.cfg:/etc/xrootd/xrdrucio.cfg:ro
      - ./configs/xrootd/authdb:/etc/xrootd/authdb:ro
      - ./configs/xrootd/scitokens.conf:/etc/xrootd/scitokens.conf:ro
      - ./scripts/xrootd/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint.sh"]

  xrd4:
    image: rucio/test-xrootd@sha256:27d212ec136d6d2ed7029fc445384053acb551805060cae554597a32e6361df4
    hostname: xrd4
    environment:
      - XRDPORT=1094
    ports:
      - "1095:1094"
    networks:
      - dep-dlm-testbed
    volumes:
      - ./certs/xrd4cert.pem:/tmp/xrdcert.pem:ro
      - ./certs/xrd4key.pem:/tmp/xrdkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/rucio_ca.pem:/etc/pki/ca-trust/source/anchors/rucio-ca.crt:ro
      - ./configs/xrootd/xrdrucio-scitokens.cfg:/etc/xrootd/xrdrucio.cfg:ro
      - ./configs/xrootd/authdb:/etc/xrootd/authdb:ro
      - ./configs/xrootd/scitokens.conf:/etc/xrootd/scitokens.conf:ro
      - ./scripts/xrootd/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint.sh"]

  ftsdb:
    image: mysql:8.4
    hostname: ftsdb
    environment:
      - MYSQL_USER=fts
      - MYSQL_PASSWORD=fts
      - MYSQL_ROOT_PASSWORD=fts
      - MYSQL_DATABASE=fts
    networks:
      - dep-dlm-testbed
    volumes:
      - ftsdb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufts", "-pfts"]
      interval: 5s
      timeout: 5s
      retries: 20

  fts:
    image: mgajekcern/test-fts:latest
    hostname: fts
    environment:
      - REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
    ports:
      - "8446:8446"
    depends_on:
      ftsdb:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - dep-dlm-testbed
    volumes:
      - ./certs/hostcert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/hostkey.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/5fca1cb1.signing_policy:/etc/grid-security/certificates/5fca1cb1.signing_policy:ro
      - ./certs/4e5da105.0:/etc/grid-security/certificates/4e5da105.0:ro
      - ./certs/4e5da105.signing_policy:/etc/grid-security/certificates/4e5da105.signing_policy:ro
      - ./certs/rucio_ca.pem:/etc/pki/ca-trust/source/anchors/rucio-ca.crt:ro
      - ./configs/fts/fts3config:/etc/fts3/fts3config:ro
      - ./configs/fts/managed.fts3restconfig:/etc/fts3/fts3restconfig:ro
      - ./configs/fts/gfal2_http_plugin.conf:/etc/gfal2.d/http_plugin.conf:ro
      - ./scripts/fts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./patches/fts/middleware.py:/tmp/fts-rest-flask/src/fts3rest/fts3rest/config/middleware.py:ro
      - ./patches/fts/openidconnect.py:/tmp/fts-rest-flask/src/fts3rest/fts3rest/lib/openidconnect.py:ro
      - ./patches/fts/JobBuilder.py:/tmp/fts-rest-flask/src/fts3rest/fts3rest/lib/JobBuilder.py:ro
      - ./patches/fts/tokenproviders.py:/tmp/fts-rest-flask/src/fts3rest/fts3rest/controllers/config/tokenproviders.py:ro
    entrypoint: ["bash", "-c", "/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8446/whoami"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    hostname: keycloak
    command:
      - start-dev
      - --features=token-exchange,admin-fine-grained-authz,dynamic-scopes
      - --health-enabled=true
      - --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/keycloakcert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/keycloakkey.pem
      - KC_HOSTNAME=keycloak
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - dep-dlm-testbed
    volumes:
      - ./configs/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./certs/keycloakcert.pem:/etc/x509/https/keycloakcert.pem:ro
      - ./certs/keycloakkey.pem:/etc/x509/https/keycloakkey.pem:ro

  ruciodb:
    image: postgres:14
    hostname: ruciodb
    environment:
      - POSTGRES_USER=rucio
      - POSTGRES_PASSWORD=rucio
      - POSTGRES_DB=rucio
    networks:
      - dep-dlm-testbed
    volumes:
      - ruciodb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rucio"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.8.0
    hostname: opa
    ports:
      - "8181:8181"
    networks:
      - dep-dlm-testbed
    command: run --server --log-level info --addr=0.0.0.0:8181

  opa-init:
    image: python:3.11-slim
    hostname: opa-init
    depends_on:
      - opa
    networks:
      - dep-dlm-testbed
    volumes:
      # mounts deploy/ itself — ingest_policies.py + rego/ are siblings here
      - ./scripts/ingest_policies.py:/app/ingest_policies.py:ro
      - ./rego/authz.rego:/app/rego/authz.rego:ro
    working_dir: /app
    command:
      - sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://opa:8181/health')" 2>/dev/null; do sleep 1; done
        python ingest_policies.py --opa-url http://opa:8181
    restart: "no"

  rucio-server:
    image: rucio/rucio-server:release-41.2.1
    hostname: rucio-server
    environment:
      - REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
      - OPA_URL=http://opa:8181
      - OPA_POLICY_PATH=vo/authz/v5/allow
      - OPA_TIMEOUT=2
      - RUCIO_OPA_DEBUG_INPUT=1
    ports:
      - "8090:80"
    depends_on:
      ruciodb:
        condition: service_healthy
      fts:
        condition: service_healthy
      keycloak:
        condition: service_started
      opa-init:
        condition: service_completed_successfully
    networks:
      - dep-dlm-testbed
    entrypoint:
      - bash
      - -c
      - |
        update-ca-trust extract &&
        cp -r /policy-package/phase6-opa /tmp/rucio-opa-policy &&
        pip install -q --force-reinstall --no-deps /tmp/rucio-opa-policy &&
        python3 /scripts/rucio/bootstrap-db.py &&
        dnf -y install yum-utils epel-release.noarch &&
        dnf install -y gfal2-all python3-gfal2-util python3-gfal2 gfal2-plugin-http &&
        exec /docker-entrypoint.sh httpd -DFOREGROUND
    volumes:
      - ../../:/policy-package:ro
      - ./configs/rucio/server.token-exchange.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ./configs/rucio/alembic.ini:/opt/rucio/etc/alembic.ini:ro
      - ./configs/rucio/idpsecrets.json:/opt/rucio/etc/idpsecrets.json:ro
      - ./certs/hostcert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/hostkey.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/rucio_ca.pem:/etc/grid-security/certificates/rucio_ca.pem:ro
      - ./certs/hostcert_with_key.pem:/etc/grid-security/hostcert_with_key.pem:ro
      - ./patches/rucio/fts3.py:/usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py:ro
      - ./patches/rucio/oidc.py:/usr/local/lib/python3.9/site-packages/rucio/core/oidc.py:ro
      - ./patches/rucio/constants.py:/usr/local/lib/python3.9/site-packages/rucio/common/constants.py:ro
      - ./patches/rucio/rse.py:/usr/local/lib/python3.9/site-packages/rucio/core/rse.py:ro
      - ./scripts/rucio/bootstrap-db.py:/scripts/rucio/bootstrap-db.py:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  rucio-client:
    image: mgajekcern/rucio-client-docker-kubectl:3867d9453cff79ce4d3b9354065e1c57402dafc7
    hostname: rucio-client
    depends_on:
      rucio-server:
        condition: service_healthy
    networks:
      - dep-dlm-testbed
    environment:
      - REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
      - AWS_CA_BUNDLE=/etc/pki/tls/cert.pem
      - OIDC_ISSUER=https://keycloak:8443/realms/rucio
      - OIDC_TOKEN_URL=https://keycloak:8443/realms/rucio/protocol/openid-connect/token
      - OIDC_CLIENT_ID=rucio
      - OIDC_CLIENT_SECRET=rucio-secret
      - OIDC_GRANT_TYPE=password
      - OIDC_USERNAME=randomaccount
      - OIDC_PASSWORD=secret
      - OIDC_EXPECTED_SCOPE=openid storage.read:/ storage.modify:/ aud:xrd3 aud:xrd4
    volumes:
      - ./certs/hostcert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/hostkey.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/rucio_ca.pem:/etc/grid-security/certificates/rucio_ca.pem:ro
      - ./configs/rucio/userpass-client.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ../../tests:/tests:ro
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir pytest boto3 &&
        sleep infinity

  rucio-daemons:
    image: rucio/rucio-daemons:release-41.2.1
    hostname: rucio-daemons
    depends_on:
      ruciodb:
        condition: service_healthy
      rucio-server:
        condition: service_healthy
      fts:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - dep-dlm-testbed
    environment:
      - REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
      - RUCIO_ENABLE_LOGS=True
      - OPA_URL=http://opa:8181
      - OPA_POLICY_PATH=vo/authz/v5/allow
      - OPA_TIMEOUT=2
    entrypoint:
      - bash
      - -c
      - |
        update-ca-trust extract &&
        cp -r /policy-package/phase6-opa /tmp/rucio-opa-policy &&
        pip install -q --force-reinstall --no-deps /tmp/rucio-opa-policy &&
        dnf -y install yum-utils epel-release.noarch &&
        dnf install -y gfal2-all python3-gfal2-util python3-gfal2 gfal2-plugin-http &&
        { rucio-conveyor-submitter --sleep-time 5 &
          rucio-conveyor-poller --sleep-time 5 &
          rucio-conveyor-finisher --sleep-time 5 &
          rucio-judge-evaluator --sleep-time 5 &
          rucio-judge-cleaner --sleep-time 5 &
          rucio-reaper --greedy --sleep-time 5 &
          wait; }
    volumes:
      - ../../:/policy-package:ro
      - ./configs/rucio/server.token-exchange.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ./configs/rucio/idpsecrets.json:/opt/rucio/etc/idpsecrets.json:ro
      - ./certs/hostcert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/hostkey.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/5fca1cb1.0:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/rucio_ca.pem:/etc/grid-security/certificates/rucio_ca.pem:ro
      - ./certs/hostcert_with_key.pem:/etc/grid-security/hostcert_with_key.pem:ro
      - ./certs/rucio_ca.pem:/etc/pki/ca-trust/source/anchors/rucio-ca.crt:ro
      - ./patches/rucio/fts3.py:/usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py:ro
      - ./patches/rucio/oidc.py:/usr/local/lib/python3.9/site-packages/rucio/core/oidc.py:ro
      - ./patches/rucio/constants.py:/usr/local/lib/python3.9/site-packages/rucio/common/constants.py:ro
      - ./patches/rucio/rse.py:/usr/local/lib/python3.9/site-packages/rucio/core/rse.py:ro

  teapot1:
    image: mgajekcern/teapot:latest
    platform: linux/amd64
    hostname: teapot1
    ports:
      - "8081:8081"
    networks:
      - dep-dlm-testbed
    volumes:
      - ./configs/teapot/config.ini:/etc/teapot/config.ini:ro
      - ./certs/rucio_ca.pem:/usr/local/share/ca-certificates/rucio-ca.crt:ro
      - ./certs/rucio_ca.pem:/var/lib/teapot/webdav/Teapot-testing.crt:ro
      - ./certs/teapot1cert.pem:/var/lib/teapot/webdav/teapot.crt:ro
      - ./certs/teapot1key.pem:/var/lib/teapot/webdav/teapot.key:ro
      - ./certs/storm-webdav-localhostcert.pem:/etc/storm/webdav/localhost.crt:ro
      - ./certs/storm-webdav-localhostkey.pem:/etc/storm/webdav/localhost.key:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/rucio_ca.pem:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/5fca1cb1.signing_policy:/etc/grid-security/certificates/5fca1cb1.signing_policy:ro
      - ./certs/b96dc756.0:/etc/grid-security/certificates/b96dc756.0:ro
      - ./certs/b96dc756.signing_policy:/etc/grid-security/certificates/b96dc756.signing_policy:ro
      - ./configs/teapot/application.yml:/var/lib/teapot/user-teapot/config/application.yml:ro
      - ./configs/teapot/data.properties:/var/lib/teapot/user-teapot/sa.d/data.properties:ro
      - ./configs/teapot/user-mapping.csv:/etc/teapot/user-mapping.csv:ro
      - ./configs/teapot/logback.xml:/etc/teapot/logback.xml:ro
      - ./patches/teapot/teapot.py:/usr/share/teapot/teapot.py:ro
      - teapot1-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8081/docs", "-o", "/dev/null", "-w", "%{http_code}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  teapot2:
    image: mgajekcern/teapot:latest
    platform: linux/amd64
    hostname: teapot2
    ports:
      - "8082:8081"
    networks:
      - dep-dlm-testbed
    volumes:
      - ./configs/teapot/config.ini:/etc/teapot/config.ini:ro
      - ./certs/rucio_ca.pem:/usr/local/share/ca-certificates/rucio-ca.crt:ro
      - ./certs/rucio_ca.pem:/var/lib/teapot/webdav/Teapot-testing.crt:ro
      - ./certs/teapot2cert.pem:/var/lib/teapot/webdav/teapot.crt:ro
      - ./certs/teapot2key.pem:/var/lib/teapot/webdav/teapot.key:ro
      - ./certs/storm-webdav-localhostcert.pem:/etc/storm/webdav/localhost.crt:ro
      - ./certs/storm-webdav-localhostkey.pem:/etc/storm/webdav/localhost.key:ro
      - ./certs/tls_ca_bundle.pem:/etc/grid-security/certificates/tls_ca_bundle.pem:ro
      - ./certs/rucio_ca.pem:/etc/grid-security/certificates/5fca1cb1.0:ro
      - ./certs/5fca1cb1.signing_policy:/etc/grid-security/certificates/5fca1cb1.signing_policy:ro
      - ./certs/b96dc756.0:/etc/grid-security/certificates/b96dc756.0:ro
      - ./certs/b96dc756.signing_policy:/etc/grid-security/certificates/b96dc756.signing_policy:ro
      - ./configs/teapot/application.yml:/var/lib/teapot/user-teapot/config/application.yml:ro
      - ./configs/teapot/data.properties:/var/lib/teapot/user-teapot/sa.d/data.properties:ro
      - ./configs/teapot/user-mapping.csv:/etc/teapot/user-mapping.csv:ro
      - ./configs/teapot/logback.xml:/etc/teapot/logback.xml:ro
      - ./patches/teapot/teapot.py:/usr/share/teapot/teapot.py:ro
      - teapot2-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8081/docs", "-o", "/dev/null", "-w", "%{http_code}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

networks:
  dep-dlm-testbed:
    name: compose-net

volumes:
  ruciodb-data:
  ftsdb-data:
  teapot1-data:
  teapot2-data:
