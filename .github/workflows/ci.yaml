name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test-phase1:
    name: Phase 1 - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pytest-cov -e phase1-no-opa/
      - name: Phase 1 - Unit tests
        run: |
          python -m pytest \
            tests/test_phase1_rules.py \
            tests/test_phase1_permission.py \
            -v --tb=short \
            --cov=phase1-no-opa/src \
            --cov-report=term-missing \
            --cov-report=xml:coverage-phase1.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-phase1
          path: coverage-phase1.xml

  test-phase2:
    name: Phase 2
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase_dir: phase2-opa
      phase_label: "Phase 2"
      unit_test_file: tests/test_phase2_opa.py
      coverage_src: phase2-opa/src
      e2e_test_file: tests/test_phase2_e2e.py
      smoke_test_file: tests/test_phase2_smoke.py

  test-phase3:
    name: Phase 3
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase_dir: phase3-opa
      phase_label: "Phase 3"
      unit_test_file: tests/test_phase3_opa.py
      coverage_src: phase3-opa/src
      e2e_test_file: tests/test_phase3_e2e.py
      smoke_test_file: tests/test_phase3_smoke.py

  test-phase4:
    name: Phase 4
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase_dir: phase4-opa
      phase_label: "Phase 4"
      needs_keycloak: true
      e2e_test_file: tests/test_phase4_e2e.py
      smoke_test_file: tests/test_phase4_smoke.py

  test-phase5:
    name: Phase 5
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase_dir: phase5-opa
      phase_label: "Phase 5"
      needs_keycloak: true
      e2e_test_file: tests/test_phase5_e2e.py
      smoke_test_file: tests/test_phase5_smoke.py

  test-phase6:
    name: Phase 6
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase_dir: phase6-opa
      phase_label: "Phase 6"
      needs_keycloak: true
      smoke_test_file: tests/test_phase6_smoke.py
