name: Policy Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1
      - name: Run pre-commit hooks
        run: make lint

  rego:
    name: Rego - unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1
      - run: make test-rego

  test-phase4:
    name: Phase 4
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase: "4"
      phase_label: "Phase 4"
      needs_keycloak: true

  test-phase5:
    name: Phase 5
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase: "5"
      phase_label: "Phase 5"
      needs_keycloak: true

  test-phase6:
    name: Phase 6
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase: "6"
      phase_label: "Phase 6"
      run_transfer_tests: true
      needs_keycloak: true

  test-phase6-service:
    name: Phase 6 (authz-service)
    uses: ./.github/workflows/_phase-opa-tests.yml
    with:
      phase: "6"
      phase_label: "Phase 6 (authz-service)"
      authz_mode: "service"
      needs_keycloak: true
