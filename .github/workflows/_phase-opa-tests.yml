name: Phase OPA Tests

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
        description: phase key, e.g. phase2
      package_dir:
        required: true
        type: string
        description: installable policy package, e.g. phase2-opa
      phase_label:
        required: true
        type: string
        description: e.g. "Phase 2"
      unit_test_file:
        required: false
        type: string
        default: ""
        description: mocked-OPA unit tests; omit for phases that have none (4/5/6)
      coverage_src:
        required: false
        type: string
        default: ""
        description: e.g. phase2-opa/src — omit to skip coverage upload
      e2e_test_file:
        required: false
        type: string
        default: ""
      smoke_test_file:
        required: false
        type: string
        default: ""
      needs_keycloak:
        required: false
        type: boolean
        default: false
      test_container:
        required: false
        type: string
        default: ""
        description: compose service to run the tests in; empty runs them on the runner

env:
  COMPOSE_FILE: deploy/compose/docker-compose.${{ inputs.phase }}.yml

jobs:
  test:
    name: ${{ inputs.phase_label }} - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pytest-cov requests urllib3 -e ${{ inputs.package_dir }}/

      - name: Unit tests (OPA mocked)
        if: inputs.unit_test_file != ''
        run: |
          python -m pytest ${{ inputs.unit_test_file }} \
            -v --tb=short \
            --cov=${{ inputs.coverage_src }} \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ inputs.package_dir }}-unit.xml

      - name: Generate certificates
        run: |
          [ -x scripts/generate-certs.sh ] || { echo "No certs to generate."; exit 0; }
          cd scripts && ./generate-certs.sh

      - name: Start full stack
        run: docker compose up -d --wait --wait-timeout 900

      - name: Wait for Keycloak token endpoint
        if: inputs.needs_keycloak
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8080/realms/rucio/protocol/openid-connect/token \
              -d "grant_type=password&client_id=rucio-oidc&client_secret=rucio-oidc-secret&username=alice&password=alice123" || echo "000")
            [ "$STATUS" = "200" ] && echo "Keycloak token endpoint ready." && exit 0
            echo "  attempt $i/30 — HTTP $STATUS"; sleep 5
          done
          echo "Keycloak token endpoint never became ready."; exit 1

      - name: Initialise testbed
        if: inputs.phase == 'phase6'
        run: cd scripts && ./init-testbed.sh

      - name: E2E tests (live OPA)
        if: inputs.e2e_test_file != ''
        env:
          OPA_URL: http://localhost:8181
        run: python -m pytest ${{ inputs.e2e_test_file }} -v --tb=short

      - name: Smoke tests
        if: inputs.smoke_test_file != '' && inputs.test_container == ''
        run: python -m pytest ${{ inputs.smoke_test_file }} -v --tb=short

      - name: Smoke tests (in container)
        if: inputs.smoke_test_file != '' && inputs.test_container != ''
        run: |
          docker compose exec -T ${{ inputs.test_container }} \
            python3 -m pytest /tests/$(basename ${{ inputs.smoke_test_file }}) -v --tb=short

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

      - if: inputs.coverage_src != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.package_dir }}-unit
          path: coverage-${{ inputs.package_dir }}-unit.xml
