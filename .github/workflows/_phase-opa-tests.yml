name: Phase OPA Tests

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
        description: phase number, e.g. "2" — everything else is derived from it
      phase_label:
        required: true
        type: string
        description: e.g. "Phase 2"
      needs_keycloak:
        required: false
        type: boolean
        default: false
      run_transfer_tests:
        required: false
        type: boolean
        default: false
        description: end-to-end transfer tests (phase 6 only)

jobs:
  test:
    name: ${{ inputs.phase_label }} - Tests
    runs-on: ubuntu-latest
    env:
      PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install-dev

      - name: Generate certificates
        if: inputs.phase == '6'
        run: make certs

      - name: Start full stack
        run: make up

      - name: Wait for Keycloak token endpoint
        if: inputs.needs_keycloak
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8080/realms/rucio/protocol/openid-connect/token \
              -d "grant_type=password&client_id=rucio-oidc&client_secret=rucio-oidc-secret&username=alice&password=alice123" || echo "000")
            [ "$STATUS" = "200" ] && echo "Keycloak token endpoint ready." && exit 0
            echo "  attempt $i/30 — HTTP $STATUS"; sleep 5
          done
          echo "Keycloak token endpoint never became ready."; exit 1

      - name: Initialise testbed
        run: make init

      - name: OPA tests (live OPA server)
        run: make test-opa

      - name: Rucio tests (REST API)
        run: make test-rucio

      # - name: Transfer tests
      #   if: inputs.run_transfer_tests
      #   run: make test-transfer

      - name: Dump logs on failure
        if: failure()
        run: make dump

      - name: Tear down
        if: always()
        run: make clean
