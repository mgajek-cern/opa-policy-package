
# Local dev dependencies for authz-service. Not the full DEP testbed —
# just what this service's dev loop needs (see design-006). Xrootd,
# FTS, Teapot, Rucio server/daemons live in the phase6 testbed compose
# and are out of scope here.
#
# make run / the VS Code launch config expect AUTHZ_OPA_URL to point
# at the OPA instance this file starts (see README.md "Local OPA").

services:
  opa:
    image: openpolicyagent/opa:1.8.0
    hostname: opa
    ports:
      - "8181:8181"
    command: run --server --log-level info --addr=0.0.0.0:8181
    # OPA's distroless image has no shell/wget/curl — healthcheck
    # omitted here too; opa-init polls OPA directly instead.

  opa-init:
    image: python:3.11-slim
    hostname: opa-init
    depends_on:
      - opa
    volumes:
      - ../scripts/ingest_policies.py:/app/ingest_policies.py:ro
      - ./authz.rego:/app/authz.rego:ro
    working_dir: /app
    command:
      - sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://opa:8181/health')" 2>/dev/null; do sleep 1; done
        python ingest_policies.py --opa-url http://opa:8181 --rego-path /app/authz.rego
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    hostname: keycloak
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --features=token-exchange,admin-fine-grained-authz,dynamic-scopes
      - --health-enabled=true
      - --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=keycloak
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8080:8080"

  # ── Observability (opt-in: --profile observability) ────────────────
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.140.1
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP, what authz-service uses
      - "4317:4317"   # OTLP/gRPC
    depends_on: [tempo, loki]

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.8.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]