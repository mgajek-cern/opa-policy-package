services:

  # OPA — Policy Decision Point
  opa:
    image: openpolicyagent/opa:1.8.0
    container_name: rucio-opa
    ports:
      - "8181:8181"
    command: >
      run
      --server
      --log-level info
      --addr=0.0.0.0:8181
    # OPA's distroless image has no shell/wget/curl — healthcheck omitted.
    # opa-init polls OPA directly before ingesting.

  # OPA init — loads the Rego policy + admin data via REST API
  opa-init:
    image: python:3.11-slim
    container_name: rucio-opa-init
    depends_on:
      - opa
    volumes:
      - ../../scripts/ingest_policies.py:/app/ingest_policies.py:ro
      - ../../rego/phase2:/app/rego/phase2:ro
    working_dir: /app
    command:
      - sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://opa:8181/health')" 2>/dev/null; do sleep 1; done
        python ingest_policies.py --phase phase2 --opa-url http://opa:8181 \
          --rego-path /app/rego/phase2/authz.rego
    restart: "no"

  # PostgreSQL — Rucio metadata store
  ruciodb:
    image: postgres:14
    container_name: ruciodb
    hostname: ruciodb
    environment:
      - POSTGRES_USER=rucio
      - POSTGRES_PASSWORD=rucio
      - POSTGRES_DB=rucio
    volumes:
      - ruciodb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rucio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rucio server — configured to use the OPA policy package
  rucio:
    image: rucio/rucio-server:latest
    container_name: rucio-server
    hostname: rucio
    depends_on:
      opa-init:
        condition: service_completed_successfully
      ruciodb:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - OPA_URL=http://opa:8181
      - OPA_POLICY_PATH=vo/authz/allow
      - OPA_TIMEOUT=2
    volumes:
      - ../../configs/rucio/phase2/rucio.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ../../scripts/rucio/bootstrap-db.py:/tmp/bootstrap-db.py:ro
      - ../../configs/rucio/alembic.ini:/opt/rucio/etc/alembic.ini:ro
      - ../../:/policy-package:ro
    entrypoint:
      - bash
      - -c
      - |
        cp -r /policy-package/phase2-opa /tmp/rucio-opa-policy &&
        pip install -q --force-reinstall --no-deps /tmp/rucio-opa-policy &&
        python3 /tmp/bootstrap-db.py &&
        exec /docker-entrypoint.sh httpd -DFOREGROUND
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

volumes:
  ruciodb-data:
