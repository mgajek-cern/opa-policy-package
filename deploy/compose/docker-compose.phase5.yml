services:

  # Keycloak — single realm, entitlements emitted in JWT
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: rucio-keycloak
    hostname: keycloak
    command: start-dev --health-enabled=true --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the issuer. Without KC_HOSTNAME, start-dev derives iss from the
      # request Host, so a token minted via localhost:8080 carries a
      # different iss than one minted in-network and validate_jwt rejects
      # it. Do not add KC_HOSTNAME_PORT — it makes Keycloak enforce
      # absolute URLs and realm discovery stops answering.
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../../configs/keycloak/phase5/realm.json:/opt/keycloak/data/import/realm.json:ro

  # OPA — Policy Decision Point
  opa:
    image: openpolicyagent/opa:1.8.0
    container_name: rucio-opa
    ports:
      - "8181:8181"
    command: run --server --log-level info --addr=0.0.0.0:8181

  # OPA init — loads Rego + policy data + group policy bundle
  opa-init:
    image: python:3.11-slim
    container_name: rucio-opa-init
    depends_on:
      - opa
    volumes:
      - ../../scripts/ingest_policies.py:/app/ingest_policies.py:ro
      - ../../policies/rego/phase5:/app/rego/phase5:ro
    working_dir: /app
    command:
      - sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://opa:8181/health')" 2>/dev/null; do sleep 1; done
        python ingest_policies.py --phase phase5 --opa-url http://opa:8181 \
          --rego-path /app/rego/phase5/authz.rego
    restart: "no"

  # PostgreSQL
  ruciodb:
    image: postgres:14
    container_name: ruciodb
    hostname: ruciodb
    environment:
      POSTGRES_USER: rucio
      POSTGRES_PASSWORD: rucio
      POSTGRES_DB: rucio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rucio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rucio server — OIDC configured, Phase 5 policy package
  rucio:
    image: rucio/rucio-server:latest
    container_name: rucio-server
    hostname: rucio
    depends_on:
      opa-init:
        condition: service_completed_successfully
      ruciodb:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "80:80"
    environment:
      OPA_URL: http://opa:8181
      OPA_POLICY_PATH: vo/authz/v4/allow
      OPA_TIMEOUT: 2
      RUCIO_OPA_DEBUG_INPUT: 1
    volumes:
      - ../../configs/rucio/phase5/rucio.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ../../configs/rucio/phase5/idpsecrets.json:/opt/rucio/etc/idpsecrets.json:ro
      - ../../scripts/rucio/bootstrap-db.py:/tmp/bootstrap-db.py:ro
      - ../../configs/rucio/alembic.ini:/opt/rucio/etc/alembic.ini:ro

      - ../../patches/rucio/fts3.py:/usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py:ro
      - ../../patches/rucio/oidc.py:/usr/local/lib/python3.9/site-packages/rucio/core/oidc.py:ro
      - ../../patches/rucio/constants.py:/usr/local/lib/python3.9/site-packages/rucio/common/constants.py:ro
      - ../../patches/rucio/types.py:/usr/local/lib/python3.9/site-packages/rucio/common/types.py:ro
      - ../../patches/rucio/authentication.py:/usr/local/lib/python3.9/site-packages/rucio/core/authentication.py:ro
      - ../../patches/rucio/common.py:/usr/local/lib/python3.9/site-packages/rucio/web/rest/flaskapi/v1/common.py:ro

      - ../../:/policy-package:ro
    entrypoint:
      - bash
      - -c
      - |
        cp -r /policy-package/phases/phase5-opa /tmp/rucio-opa-policy &&
        pip install -q --force-reinstall --no-deps /tmp/rucio-opa-policy &&
        python3 /tmp/bootstrap-db.py &&
        exec /docker-entrypoint.sh httpd -DFOREGROUND
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

volumes:
  ruciodb-data:
